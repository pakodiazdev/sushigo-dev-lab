networks:
  sushigo-dev:
    external: true
    name: sushigo-dev-lab_default

x-e2e-service: &e2e-service
  build:
    context: docker/php-e2e
  restart: "no"
  networks:
    - sushigo-dev

x-e2e-env: &e2e-env
  APP_ENV: testing
  APP_DEBUG: "false"
  QUEUE_CONNECTION: sync
  CACHE_STORE: array
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER:-admin}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}

services:
  e2e-api-a:
    <<: *e2e-service
    volumes:
      - ./workspaces/sushigo-a/code/api:/app
    ports:
      - "127.0.0.1:${E2E_API_PORT_A:-8901}:8099"
    environment:
      <<: *e2e-env
      DB_DATABASE: sushigo_ws_a_e2e
      CACHE_PREFIX: e2e_a_
      APP_URL: http://127.0.0.1:${E2E_API_PORT_A:-8901}

